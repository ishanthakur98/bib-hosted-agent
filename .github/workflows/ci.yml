name: Dummy Agent CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python and pip cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - name: Install requirements
        run: |
          python -m pip install setuptools==75.8.0 wheel==0.45.1 Cython==0.29.37
          python -m pip install --no-build-isolation -r agent/requirements.txt
      - name: Lint
        run: python -m flake8 agent tests
      - name: Test
        run: python -m pytest tests -q

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build local image
        env:
          IMAGE_TAG: dummy-agent:${{ github.sha }}
        run: docker build --tag "$IMAGE_TAG" .
      - name: Save local image
        env:
          IMAGE_TAG: dummy-agent:${{ github.sha }}
        run: docker save --output dummy-agent.tar "$IMAGE_TAG"
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: dummy-agent-image
          path: dummy-agent.tar
          retention-days: 7
          if-no-files-found: error

  security-scan:
    runs-on: windows-latest
    needs: build-and-test
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Scan with Microsoft Security DevOps
        id: msdo
        uses: microsoft/security-devops-action@latest
        continue-on-error: true
        with:
          categories: 'code,secrets,IaC,containers'
      - name: Upload SARIF to GitHub Security
        if: ${{ always() && steps.msdo.outputs.sarifFile != '' }}
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: ${{ steps.msdo.outputs.sarifFile }}
      - name: Upload MSDO results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: msdo-results
          path: .gdn/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Record scan outcome
        if: ${{ always() }}
        shell: pwsh
        env:
          SCAN_OUTCOME: ${{ steps.msdo.outcome }}
        run: |
          "### MSDO scan`nRaw scan outcome: $env:SCAN_OUTCOME. See scan logs and artifacts for findings or tool errors." >> $env:GITHUB_STEP_SUMMARY

  summary:
    runs-on: ubuntu-latest
    needs: [build-and-test, docker-build, security-scan]
    if: ${{ always() }}
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read
    steps:
      - name: Write job summary
        env:
          BUILD_RESULT: ${{ needs.build-and-test.result }}
          DOCKER_RESULT: ${{ needs.docker-build.result }}
          SCAN_RESULT: ${{ needs.security-scan.result }}
        run: |
          {
            echo '## Dummy Hosted Agent Demo'
            echo "Build and tests: $BUILD_RESULT"
            echo "Local Docker build: $DOCKER_RESULT"
            echo "Security job (non-blocking scan): $SCAN_RESULT"
            echo 'Review the security job summary, GitHub Security tab, and MSDO artifacts.'
            echo 'Nothing was deployed or pushed to a registry. All credential fixtures are fake.'
          } >> "$GITHUB_STEP_SUMMARY"